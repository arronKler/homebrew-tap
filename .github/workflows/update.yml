name: Update cask

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the latest release
        id: release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/arronKler/herdr-island/releases/latest \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("tag_name")')"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest release: $tag"

      - name: Fetch and verify the archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/arronKler/herdr-island/releases/download/v$VERSION"
          curl -fsSL -o "$RUNNER_TEMP/HerdrIsland.zip" "$base/HerdrIsland-$VERSION.zip"
          curl -fsSL -o "$RUNNER_TEMP/HerdrIsland.zip.sha256" "$base/HerdrIsland-$VERSION.zip.sha256"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/HerdrIsland.zip.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/HerdrIsland.zip" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch: published $expected, downloaded $actual" >&2
            exit 1
          fi
          echo "sha256=$actual" >> "$GITHUB_ENV"

      - name: Update the cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ruby -e '
            path, version, sha = ARGV
            text = File.read(path)
            changed = false
            [[/^  version ".*"$/, %(  version "#{version}")],
             [/^  sha256 ".*"$/, %(  sha256 "#{sha}")]].each do |pattern, line|
              match = text[pattern] or abort("missing #{pattern.source}")
              next if match == line

              text = text.sub(pattern, line)
              changed = true
            end
            exit 3 unless changed
            File.write(path, text)
          ' Casks/herdr-island.rb "$VERSION" "$sha256" || status=$?
          status=${status:-0}
          if [ "$status" -eq 3 ]; then
            echo "cask already at $VERSION"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          ruby -c Casks/herdr-island.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/herdr-island.rb; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "Herdr Island release"
          git config user.email "release@herdr.dev"
          git add Casks/herdr-island.rb
          git commit -m "Update Herdr Island to $VERSION"
          git push
