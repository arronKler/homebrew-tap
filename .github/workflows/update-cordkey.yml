name: Update CordKey cask

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the latest release
        id: release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/arronKler/cordkey/releases/latest \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("tag_name")')"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest release: $tag"

      - name: Fetch and verify the archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="CordKey-$VERSION-macos-universal.zip"
          base="https://github.com/arronKler/cordkey/releases/download/v$VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          expected="$(awk -v f="$archive" '$2 == f {print $1}' "$RUNNER_TEMP/SHA256SUMS.txt")"
          if [ -z "$expected" ]; then
            echo "missing checksum entry for $archive in SHA256SUMS.txt" >&2
            exit 1
          fi
          actual="$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch: published $expected, downloaded $actual" >&2
            exit 1
          fi
          echo "sha256=$actual" >> "$GITHUB_ENV"

      - name: Update the cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ruby -e '
            path, version, sha = ARGV
            text = File.read(path)
            changed = false
            [[/^  version ".*"$/, %(  version "#{version}")],
             [/^  sha256 ".*"$/, %(  sha256 "#{sha}")]].each do |pattern, line|
              match = text[pattern] or abort("missing #{pattern.source}")
              next if match == line

              text = text.sub(pattern, line)
              changed = true
            end
            exit 3 unless changed
            File.write(path, text)
          ' Casks/cordkey.rb "$VERSION" "$sha256" || status=$?
          status=${status:-0}
          if [ "$status" -eq 3 ]; then
            echo "cask already at $VERSION"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          ruby -c Casks/cordkey.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/cordkey.rb; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "arronkler"
          git config user.email "panzer9@126.com"
          git add Casks/cordkey.rb
          git commit -m "Update CordKey to $VERSION"
          git push
